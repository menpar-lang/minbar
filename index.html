<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منبر التحصيلي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --fg: #172036;
  --muted: #5a6580;
  --line: #dfe4f0;
  --brand: #3a4bd8;
  --brand2: #7a3fe0;
  --math: #2f6fed;
  --phys: #8b4fe0;
  --chem: #c75a00;
  --bio: #178a5c;
  --practice: #d6336c;
  --subj: var(--math);
  --on-color: #ffffff;
  --font: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1220;
    --surface: #171d33;
    --fg: #eef1fb;
    --muted: #9aa5c4;
    --line: #2a3354;
    --brand: #6c7bff;
    --brand2: #a272ff;
    --math: #4a85ff;
    --phys: #a876ff;
    --chem: #e57a1a;
    --bio: #25b57c;
    --practice: #ef5a92;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1220;
  --surface: #171d33;
  --fg: #eef1fb;
  --muted: #9aa5c4;
  --line: #2a3354;
  --brand: #6c7bff;
  --brand2: #a272ff;
  --math: #4a85ff;
  --phys: #a876ff;
  --chem: #e57a1a;
  --bio: #25b57c;
  --practice: #ef5a92;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.7;
  margin: 0;
  direction: rtl;
  text-align: right;
}
.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.hero {
  background: linear-gradient(135deg, var(--brand), var(--brand2));
  color: #fff;
  padding-block: 36px 64px;
  text-align: center;
}
.hero h1 {
  font-size: clamp(34px, 8vw, 54px);
  font-weight: 800;
  margin: 0;
  letter-spacing: 0;
  text-wrap: balance;
}
.hero p {
  margin: 8px 0 0;
  font-size: 18px;
  font-weight: 500;
  opacity: .92;
}

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 6px;
  margin-top: -32px;
  position: relative;
}
.tab {
  font: inherit;
  font-size: 20px;
  font-weight: 800;
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 12px;
  border-radius: 11px;
  cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--brand); color: #fff; }
.tab[data-tab="practice"][aria-selected="true"] { background: var(--practice); }
.tab:focus-visible, .chip input:focus-visible + span, button:focus-visible, input:focus-visible {
  outline: 3px solid var(--brand2);
  outline-offset: 2px;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  margin-top: 16px;
}
.panel h2 { margin: 0 0 4px; font-size: 22px; }
.panel .hint { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
.label { display: block; font-weight: 700; margin-bottom: 8px; }
.chips {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}
.chip { position: relative; display: block; }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chip span {
  display: block;
  text-align: center;
  font-weight: 800;
  font-size: 18px;
  padding: 12px 8px;
  border-radius: 12px;
  border: 2px solid var(--c);
  color: var(--c);
  background: transparent;
}
.chip input:checked + span { background: var(--c); color: var(--on-color); }
.fields {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}
.fields > div { min-width: 0; }
input[type="number"] {
  width: 100%;
  font: inherit;
  font-size: 20px;
  font-weight: 700;
  padding: 10px 14px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--bg);
  color: var(--fg);
}
.go {
  font: inherit;
  font-size: 19px;
  font-weight: 800;
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 14px;
  color: #fff;
  background: var(--brand);
  cursor: pointer;
}
.go.practice { background: var(--practice); }
.err { color: var(--practice); font-weight: 700; margin: 10px 0 0; min-height: 1.5em; }

#result[hidden] { display: none; }
.summary {
  background: var(--subj);
  color: var(--on-color);
  border-radius: 16px;
  padding: 18px 20px;
  margin-top: 16px;
}
.summary h3 { margin: 0 0 4px; font-size: 22px; }
.summary p { margin: 0; font-size: 16px; font-weight: 500; }
.bar { height: 12px; border-radius: 99px; background: rgba(255,255,255,.3); margin-top: 12px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 99px; transition: width .4s; }
.days { display: grid; gap: 14px; margin-top: 16px; }
.day {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
}
.day-body { padding: 16px 18px; display: grid; gap: 10px; }
.day-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.day-no {
  font-weight: 800;
  font-size: 19px;
  color: var(--subj);
}
.task { font-size: 20px; font-weight: 700; }
.task small { display: block; font-size: 15px; font-weight: 500; color: var(--muted); }
.done {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  cursor: pointer;
  user-select: none;
}
.done input { width: 22px; height: 22px; accent-color: var(--subj); }
.cheer {
  background: var(--subj);
  color: var(--on-color);
  padding: 12px 18px;
  font-weight: 700;
  font-size: 17px;
}
.day.is-done .task { text-decoration: line-through; opacity: .6; }
.day.is-done .cheer { filter: saturate(1.15); }
.finish {
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  padding: 18px;
  border-radius: 16px;
  color: var(--on-color);
  background: linear-gradient(135deg, var(--brand), var(--brand2));
}
footer { text-align: center; color: var(--muted); font-size: 14px; padding-block: 28px 20px; }

.go.pdf { margin-top: 14px; background: var(--fg); color: var(--bg); }

@media print {
  .tabs, .panel, .go, .done, .err, footer, .finish { display: none !important; }
  body { background: #fff; }
  .hero, .summary, .cheer { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .hero { padding-block: 16px; }
  .day { break-inside: avoid; }
}

@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>منبر التحصيلي</h1>
    <p>جدولك اليومي للتأسيس والتدريب، وانت بس عليك الالتزام</p>
  </div>
</header>

<main class="wrap">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="found" id="t-found" aria-selected="true">تأسيس</button>
    <button class="tab" role="tab" data-tab="practice" id="t-practice" aria-selected="false">تدريب</button>
  </div>

  <section class="panel" id="p-found" role="tabpanel" aria-labelledby="t-found">
    <h2>خطة التأسيس</h2>
    <p class="hint">اختر المادة وعدد المحاضرات والأيام، ونقسمها لك على الأيام.</p>
    <span class="label">المادة</span>
    <div class="chips" id="subjects">
      <label class="chip" style="--c: var(--math)"><input type="radio" name="subj" value="math" checked><span>الرياضيات</span></label>
      <label class="chip" style="--c: var(--phys)"><input type="radio" name="subj" value="phys"><span>الفيزياء</span></label>
      <label class="chip" style="--c: var(--chem)"><input type="radio" name="subj" value="chem"><span>الكيمياء</span></label>
      <label class="chip" style="--c: var(--bio)"><input type="radio" name="subj" value="bio"><span>الأحياء</span></label>
    </div>
    <div class="fields">
      <div>
        <label class="label" for="lec">كم عدد المحاضرات؟</label>
        <input type="number" id="lec" inputmode="numeric" min="1" max="300" value="24">
      </div>
      <div>
        <label class="label" for="fdays">كم يوم تبي تخلصها فيه؟</label>
        <input type="number" id="fdays" inputmode="numeric" min="1" max="120" value="8">
      </div>
    </div>
    <button class="go" id="go-found">سوّي لي الجدول</button>
    <p class="err" id="err-found" role="alert"></p>
  </section>

  <section class="panel" id="p-practice" role="tabpanel" aria-labelledby="t-practice" hidden>
    <h2>خطة التدريب</h2>
    <p class="hint">حدد عدد الأسئلة وعدد الأيام، ونوزعها لك بالتساوي.</p>
    <div class="fields">
      <div>
        <label class="label" for="qs">كم عدد الأسئلة؟</label>
        <input type="number" id="qs" inputmode="numeric" min="1" max="5000" value="300">
      </div>
      <div>
        <label class="label" for="pdays">كم يوم؟</label>
        <input type="number" id="pdays" inputmode="numeric" min="1" max="120" value="10">
      </div>
    </div>
    <button class="go practice" id="go-practice">سوّي لي الجدول</button>
    <p class="err" id="err-practice" role="alert"></p>
  </section>

  <section id="result" hidden aria-live="polite"></section>
</main>

<footer>منبر التحصيلي · كل يوم تنجزه يقربك من درجتك</footer>

<script>
(function () {
  var SUBJ = {
    math: { name: "الرياضيات", v: "--math" },
    phys: { name: "الفيزياء", v: "--phys" },
    chem: { name: "الكيمياء", v: "--chem" },
    bio:  { name: "الأحياء",   v: "--bio" }
  };
  var CHEERS = [
    "بداية ممتازة، أصعب خطوة هي أول يوم وانت تجاوزتها!",
    "كل محاضرة تخلصها تقربك من الهدف، كمّل!",
    "الالتزام اليوم هو درجتك بكرة.",
    "ما أحد وصل للقمة وهو متكاسل، وانت ماشي صح.",
    "يوم ورا يوم وتشوف الفرق بنفسك.",
    "تعبك اليوم راحة لك يوم الاختبار.",
    "انت أقوى مما تتخيل، لا توقف.",
    "الاستمرار أهم من الكمال، أحسنت!",
    "ثقتك بنفسك نص النجاح، والنص الثاني شغلك اليوم.",
    "خذ نفس عميق وافتخر بنفسك، يوم جديد تم إنجازه.",
    "قربت تخلص، لا تهدي السرعة الحين!",
    "حلمك يستاهل كل ساعة تذاكرها."
  ];
  var FINISH = "مبروك! خلصت الخطة كاملة، انت بطل والتحصيلي ينتظرك بثقة.";

  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return Number(n).toLocaleString("ar-EG"); };
  var state = { key: "", done: {} };
  var CAN_PRINT = (function () { try { return window.top === window.self; } catch (e) { return false; } })();

  function store(get, val) {
    try {
      if (get) return JSON.parse(localStorage.getItem("mt-" + state.key) || "{}");
      localStorage.setItem("mt-" + state.key, JSON.stringify(val));
    } catch (e) {}
    return {};
  }

  function split(total, days) {
    var base = Math.floor(total / days), extra = total % days, out = [], from = 1;
    for (var i = 0; i < days; i++) {
      var cnt = base + (i < extra ? 1 : 0);
      out.push({ from: from, to: from + cnt - 1, count: cnt });
      from += cnt;
    }
    return out;
  }

  function readNum(id, min, max) {
    var v = parseInt($(id).value, 10);
    if (isNaN(v) || v < min || v > max) return null;
    return v;
  }

  function render(kind, title, subjVar, parts, itemWord) {
    var total = parts.reduce(function (s, p) { return s + p.count; }, 0);
    var html = '<div class="summary" style="--subj: var(' + subjVar + ')">' +
      '<h3>' + title + '</h3>' +
      '<p id="sum-line"></p><div class="bar"><i id="bar"></i></div></div>' +
      (CAN_PRINT ? '<button class="go pdf" id="pdf-btn" type="button">حفظ الجدول PDF</button>' : '') +
      '<div class="days">';
    parts.forEach(function (p, i) {
      var cheer = CHEERS[i % CHEERS.length];
      var task, sub = "";
      if (p.count === 0) {
        task = "يوم مراجعة";
        sub = "راجع اللي أنجزته وارتاح شوي";
      } else if (kind === "found") {
        task = p.count === 1 ? "المحاضرة " + fmt(p.from)
             : "من المحاضرة " + fmt(p.from) + " إلى المحاضرة " + fmt(p.to);
        sub = fmt(p.count) + (p.count === 1 ? " محاضرة" : p.count <= 10 ? " محاضرات" : " محاضرة");
      } else {
        task = fmt(p.count) + " " + (p.count <= 10 ? "أسئلة" : "سؤال");
        sub = "من السؤال " + fmt(p.from) + " إلى " + fmt(p.to);
      }
      html += '<article class="day" data-i="' + i + '" style="--subj: var(' + subjVar + ')">' +
        '<div class="day-body"><div class="day-top"><span class="day-no">اليوم ' + fmt(i + 1) + '</span>' +
        '<label class="done"><input type="checkbox" data-i="' + i + '"> أنجزت اليوم</label></div>' +
        '<div class="task">' + task + '<small>' + sub + '</small></div></div>' +
        '<div class="cheer">' + cheer + '</div></article>';
    });
    html += '</div><div class="finish" id="finish" hidden>' + FINISH + '</div>';
    var box = $("result");
    box.innerHTML = html;
    box.hidden = false;
    var pb = $("pdf-btn");
    if (pb) pb.addEventListener("click", function () { window.print(); });

    state.key = kind + "-" + parts.length + "-" + total + "-" + subjVar;
    state.done = store(true);
    var boxes = box.querySelectorAll('.done input');
    Array.prototype.forEach.call(boxes, function (cb) {
      cb.checked = !!state.done[cb.dataset.i];
      cb.addEventListener("change", function () {
        state.done[cb.dataset.i] = cb.checked;
        store(false, state.done);
        refresh(parts.length, itemWord);
      });
    });
    refresh(parts.length, itemWord);
    box.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function refresh(n, itemWord) {
    var cnt = 0;
    Array.prototype.forEach.call($("result").querySelectorAll(".day"), function (d) {
      var on = !!state.done[d.dataset.i];
      d.classList.toggle("is-done", on);
      if (on) cnt++;
    });
    $("sum-line").textContent = "أنجزت " + fmt(cnt) + " من " + fmt(n) + " يوم";
    $("bar").style.width = Math.round(cnt / n * 100) + "%";
    $("finish").hidden = cnt !== n;
  }

  function showTab(name) {
    ["found", "practice"].forEach(function (t) {
      $("t-" + t).setAttribute("aria-selected", String(t === name));
      $("p-" + t).hidden = t !== name;
    });
    $("result").hidden = true;
  }
  $("t-found").addEventListener("click", function () { showTab("found"); });
  $("t-practice").addEventListener("click", function () { showTab("practice"); });

  $("go-found").addEventListener("click", function () {
    var lec = readNum("lec", 1, 300), days = readNum("fdays", 1, 120), err = $("err-found");
    if (!lec || !days) { err.textContent = "عبّ عدد المحاضرات (١ إلى ٣٠٠) وعدد الأيام (١ إلى ١٢٠)."; return; }
    err.textContent = "";
    var key = document.querySelector('input[name="subj"]:checked').value;
    var s = SUBJ[key];
    render("found", "تأسيس " + s.name + ": " + fmt(lec) + " محاضرة في " + fmt(days) + " يوم", s.v, split(lec, days), "محاضرة");
  });

  $("go-practice").addEventListener("click", function () {
    var q = readNum("qs", 1, 5000), days = readNum("pdays", 1, 120), err = $("err-practice");
    if (!q || !days) { err.textContent = "عبّ عدد الأسئلة (١ إلى ٥٠٠٠) وعدد الأيام (١ إلى ١٢٠)."; return; }
    err.textContent = "";
    render("practice", "تدريب: " + fmt(q) + " سؤال في " + fmt(days) + " يوم", "--practice", split(q, days), "سؤال");
  });
})();
</script>
</body>
  </html>
